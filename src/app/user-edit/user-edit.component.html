<div class="row justify-content-center">
    <div class="col-lg-6 col-12">
        <form [formGroup]='editUserForm' (ngSubmit)="update()" autocomplete="off">
            <h2 class="text-center text-primary">Edit user</h2>
            <hr>
            <div class="form-group">
                <label for="bill-type">Username</label>
                <app-text-input [formControl]='editUserForm.controls["userName"]'
                    [label]='"User name"'></app-text-input>
                <label for="bill-type">Email</label>
                <app-text-input [formControl]='editUserForm.controls["email"]' [label]='"Email"'></app-text-input>
                <hr>

                <div formGroupName="settings">
                    <h3>Options</h3>
                    <div class="form-check">
                        <input type="checkbox" class="form-check-input" id="copyBillsValues" formControlName="copyWithValues" />
                        <label class="form-check-label" for="copyBillsValues" ngbTooltip="Uncheck this options to copy only the bills & receivings, with values zeroed-out values">Copy bills & receivings with values to next month</label>
                    </div>
                                        
                    <div class="d-flex p-2 bd-highlight w-50">                    
                        <div class="w-100 mt-2">
                            <label for="items-per-page"></label> Default items per page:                    
                        </div>
                        <div class="w-50">
                            <select id="items-per-page" class="form-select rounded" formControlName="itemsPerPage"
                                aria-label="Select items per page">
                                <option value="5">5</option>
                                <option value="10">10</option>
                                <option value="20">20</option>
                            </select>
                        </div>
                    </div>
                </div>
                <!-- <h3>Options</h3>
                <div class="form-check">
                    <input type="checkbox" class="form-check-input" id="copyBillsValues" formControlName="copyWithValues" />
                    <label class="form-check-label" for="copyBillsValues" ngbTooltip="Uncheck this options to copy only the bills & receivings, with values zeroed-out values">Copy bills & receivings with values to next month</label>
                </div> -->

                <hr>
                <label for="">Change password (optional)</label>
                <app-password-input [formControl]='editUserForm.controls["password"]'
                    [label]='"New password"'></app-password-input>
                <app-password-input [formControl]='editUserForm.controls["confirmPassword"]'
                    [label]='"Confirm new password"'></app-password-input>
            </div>

            <div class="row justify-content-center" style="text-align: center;">
                <div class="form-group">
                    <button class="btn btn-primary mr-2" type="submit" [disabled]="!editUserForm.valid">Save</button>
                </div>
            </div>
        </form>
    </div>
</div>

<div class="modal-header">    
    <div class="container">
        <h4 class="modal-title pull-left mt-2 text-success">New receiving type</h4>
        <button type="button" class="btn btn-secondary pull-right" style="min-width: 10px;" aria-label="Close" (click)="close()">
            <i class="bi bi-x-circle"></i>
        </button>
    </div>
</div>
<div class="modal-body">
    <div class="container" style="text-align: left;">
        <form [formGroup]='newReceivingTypeForm' (ngSubmit)="add()">

            <app-text-input [formControl]='newReceivingTypeForm.controls["description"]' [label]='"Description"'></app-text-input>            

            <div class="form-check">
                <input type="checkbox" class="form-check-input" id="isActive" formControlName="active">
                <label for="isActive">Is active?</label>
            </div>

            <button type="submit" class="btn btn-success mr-1 mt-3 me-2" [disabled]="!newReceivingTypeForm.valid">Add</button>
            <button type="button" class="btn btn-secondary mt-3" (click)="close()">Cancel</button>
        </form>
    </div>
</div>

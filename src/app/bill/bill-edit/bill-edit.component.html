<div class="modal-header">
  <div class="container">
    <h4 class="modal-title pull-left text-primary">Edit bill</h4>

    <button type="button" class="btn btn-secondary pull-right" style="min-width: 10px;" aria-label="Close"
      (click)="close()">
      <i class="bi bi-x-circle"></i>
    </button>
  </div>

</div>
<div class="modal-body">

  <form (ngSubmit)="save()" autocomplete="off" #billForm="ngForm">
    <div class="form-group">
      <label for="value">Value</label>

      <input 
        type="text" 
        inputmode="number"
        class="form-control w-25" 
        name="value" 
        placeholder="0.00" 
        id="value" 
        required
        [(ngModel)]="bill!.value"
        mask="separator.2"
        thousandSeparator="."
        decimalMarker="."
        prefix="R$ "
        [leadZero]="true"
      >


      <label style="padding-top: 10px;">Due date (optional)</label>
      <input class="form-control w-25" type="datetime" bsDatepicker [(bsValue)]="bill!.dueDate"
        (bsValueChange)="onValueChange($event)"
        [bsConfig]="{ dateInputFormat: 'DD/MM/YYYY', containerClass: 'theme-dark-blue', showTodayButton: true }">
    </div>
    <button class="btn btn-success mt-3 me-1" type="submit" [disabled]="!billForm.valid">Save</button>
    <button type="button" class="btn btn-secondary mt-3" (click)="close()">Cancel</button>
  </form>
</div>

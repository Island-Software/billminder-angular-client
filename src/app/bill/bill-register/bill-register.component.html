<div class="modal-header">
  <div class="container">
    <h4 class="modal-title pull-left text-primary">New bill</h4>
    <button type="button" class="btn btn-secondary pull-right" style="min-width: 10px;" aria-label="Close" (click)="close()">
      <i class="bi bi-x-circle"></i>
    </button>
  </div>
</div>

<div class="modal-body">
  <form [formGroup]='newBillForm' (ngSubmit)="add()" autocomplete="off">
    
    <label for="select-type">Type</label>
    <div class="form-group">
      <select id="select-type"
        [class.is-invalid]='newBillForm.get("typeId")?.errors && newBillForm.get("typeId")?.touched'
        class="form-control rounded" formControlName="typeId">
        <option value="" disabled>--- Select type ---</option>
        @for (billtype of billTypes; track billtype.id) {
        <option [value]="billtype.id">{{billtype.description}}</option>
        }
      </select>
      <div class="invalid-feedback">Please select a type</div>
    </div>

    <label for="value" class="mt-2">Amount</label>
    <input type="number" step="0.01" placeholder="0.00" class="form-control rounded me-auto w-25" name="value"
      id="value" required [formControl]='newBillForm.controls["value"]'>

    <div style="padding-top: 15px;">
      <label for="">Due date (optional)</label>
      <input class="form-control w-25" bsDatepicker [formControl]='newBillForm.controls["dueDate"]'
        (bsValueChange)="onValueChange($event)"
        [bsConfig]="{ dateInputFormat: 'DD/MM/YYYY', containerClass: 'theme-dark-blue' }">
    </div>

    <div class="form-group" style="padding-top: 15px;">
      <label>Register date</label>
      <div class="input-group">
        <select [class.is-invalid]='newBillForm.get("month")?.errors && newBillForm.get("month")?.touched'
          class="form-control rounded me-2" formControlName="month">
          <option value="" disabled>--- Select month ---</option>
          @for (month of months; track month) {
          <option [value]="month.id">{{month.name}}</option>
          }
        </select>
        <app-text-input [formControl]='newBillForm.controls["year"]' additionalClasses="w-50" [label]='"Year"'>
        </app-text-input>
        @if (newBillForm.get('month')?.hasError('required') && newBillForm.get('month')?.touched) {
        <div class="invalid-feedback">Please enter the month</div>
        }
      </div>
    </div>
    <button class="btn btn-success mr-1 mt-3 me-1" type="submit" [disabled]="!newBillForm.valid">Add</button>
    <button type="button" class="btn btn-secondary mt-3" (click)="close()">Cancel</button>

  </form>
  <!-- <p>Form value: {{newBillForm.value | json}}</p>
      <p>Form status: {{newBillForm.status | json}}</p> -->
</div>
